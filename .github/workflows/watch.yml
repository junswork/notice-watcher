name: 공지사항 감시

on:
  # 이 워크플로는 **예비 경로**다. 평소 감시는 VM 이 직접 한다(docs/VM직접실행.md).
  #
  # 깃허브 액션을 주 경로로 쓰다가 두 번 크게 데였다. 실제 감시는 1~3초인데
  # 액션 껍데기가 13초를 더 먹어 한 번에 16초가 걸렸고(실측), 1분 주기에
  # 여유가 없어 대기열이 밀리는 순간 줄줄이 취소됐다. 자가 실행기로 옮긴
  # 뒤에는 실행기가 깃허브와의 연결을 잃고 조용히 멎어 아홉 시간 동안
  # 아무것도 안 돈 날이 있었다.
  #
  # 그래서 주 경로를 VM 의 systemd 타이머로 옮겼다. 매번 새로 시작하는
  # 프로세스라 유지할 연결이 없다. 이 워크플로는 VM 이 통째로 죽었을 때를
  # 위해 남겨 둔다 — 느리지만 완전히 멈추지는 않는다.
  schedule:
    - cron: "*/15 * * * *"    # 새 글 (깃허브 사정에 따라 두 시간쯤마다 돈다)
    - cron: "7 4,13 * * *"    # 수정까지
    #
    # 생존 신호는 여기 두지 않는다. VM 이 죽었을 때 '신호가 안 온다' 로
    # 알아채야 하는데, 여기서 대신 보내면 그 고장을 가려 버린다.

  workflow_dispatch:
    inputs:
      mode:
        description: "new = 새 글만 / full = 수정까지"
        default: "new"
        type: choice
        options: [new, full]
      heartbeat:
        description: "살아 있다는 신호도 함께 보낼지"
        default: false
        type: boolean

permissions:
  contents: write           # state.json 을 되커밋하기 위해 필요하다
  actions: read             # 생존 신호가 취소된 실행 수를 세기 위해

# 겹쳐 돌지 않게 묶는다. 두 실행이 같은 시점의 기록을 보면 같은 공지를 두 번
# 알리게 되는데, 중복 알림은 알림 자체의 무게를 떨어뜨린다.
#
# 대신 대가가 있다. 깃허브는 한 그룹에 대기 중인 실행을 하나만 두고, 셋째가
# 오면 대기하던 것을 **취소**한다. 1분 간격으로 바꾼 뒤 깃허브가 느렸던 날
# 하루 실행의 81% 가 취소됐고, 그날 에픽폴리오는 37시간 동안 한 번도 확인되지
# 않았다(실측).
#
# 취소는 실패로 잡히지 않아 빨간불도 안 뜨고 감시 실패 알림도 안 간다. 그래서
# 생존 신호가 지난 하루의 취소 건수를 세어 알려 준다(watch.run_stats).
concurrency:
  group: notice-watch
  cancel-in-progress: false

jobs:
  watch:
    # 어디서 돌릴지는 코드가 아니라 저장소 변수로 정한다. 자가 실행기로
    # 옮기거나 되돌릴 때 커밋 없이 변수 하나만 바꾸면 된다.
    #   깃허브 공용:  gh variable set RUNNER_LABEL --body ubuntu-latest
    #   내 실행기:    gh variable set RUNNER_LABEL --body self-hosted
    # 변수가 없으면 공용 실행기를 쓴다 — 새로 받아 쓰는 사람이 아무것도
    # 설정하지 않아도 돌아가야 한다.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # 파이썬을 따로 설치하지 않는다. 깃허브 공용 실행기든 우분투 24.04 를
      # 올린 내 실행기든 파이썬 3.12 가 이미 들어 있다. setup-python 은 공용
      # 실행기에서는 미리 받아 둔 것을 쓰지만, 내 실행기에서는 매번 내려받아
      # **76초**를 먹었다(실측). 1분마다 도는 프로그램에서는 치명적이다.
      #
      # 라이브러리는 가상환경에 한 번만 깔고 다음 실행부터 그대로 쓴다.
      # 공용 실행기는 매번 새 기계라 어차피 새로 깔리고, 내 실행기는 남아 있다.
      #
      # 가상환경은 작업 폴더 밖(홈)에 둔다. checkout 은 매 실행마다 작업
      # 폴더를 깨끗이 비우므로(git clean -ffdx) 안에 두면 그때마다 지워진다.
      - name: 파이썬 준비
        run: |
          VENV=$HOME/.venv-notice
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install --quiet --upgrade -r requirements.txt
          "$VENV/bin/python" -V

      - name: 게시판 확인
        id: run
        continue-on-error: true       # 실패해도 아래 커밋 단계까지는 간다
        env:
          # 어느 일정이 깨웠는지로 확인 범위를 정한다. 손으로 돌릴 때는
          # 위 선택칸의 값을 쓰고, 아무것도 안 고르면 새 글만 본다.
          WATCH_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 4,13 * * *' && 'full' || 'new') }}
          HEARTBEAT: ${{ inputs.heartbeat && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          KAKAOWORK_USER_EMAIL: ${{ secrets.KAKAOWORK_USER_EMAIL }}
          # 게시판별 봇. boards.json 의 "bot" 이름과 반드시 같아야 한다.
          # 게시판을 추가하면 여기에도 한 줄 넣어야 한다 — 깃허브는 등록한
          # Secret 을 이름으로 나열해 줘야만 넘겨준다.
          KAKAOWORK_APP_KEY_NOTICE: ${{ secrets.KAKAOWORK_APP_KEY_NOTICE }}
          KAKAOWORK_APP_KEY_MATTERS: ${{ secrets.KAKAOWORK_APP_KEY_MATTERS }}
          KAKAOWORK_APP_KEY_HOUSING: ${{ secrets.KAKAOWORK_APP_KEY_HOUSING }}
          KAKAOWORK_APP_KEY_EPIC: ${{ secrets.KAKAOWORK_APP_KEY_EPIC }}
          # 에픽폴리오는 로그인이 필요하다. 통합 계정 아이디·비밀번호.
          EPIC_ID: ${{ secrets.EPIC_ID }}
          EPIC_PW: ${{ secrets.EPIC_PW }}
          # 위 봇이 아직 없는 게시판이 쓰는 공용 봇
          KAKAOWORK_APP_KEY: ${{ secrets.KAKAOWORK_APP_KEY }}
        run: $HOME/.venv-notice/bin/python watch.py

      - name: 확인 결과 저장
        # 성공한 부분까지는 반드시 남긴다. 남기지 않으면 다음 실행이
        # 이미 알린 공지를 새 글로 착각해 같은 알림을 또 보낸다.
        #
        # push 가 거부될 때가 있다. 앞 실행이 아직 push 하지 않은 코드를
        # 받아 가면 나중 것이 non-fast-forward 로 거부된다. 거부된 쪽을
        # 버리면 그 실행이 이미 보낸 알림의 기록까지 사라져 중복 알림이
        # 되므로, 원격 기록과 합쳐서 다시 올린다.
        #
        # 합칠 때 state.json 하나만 올린다. 예전에 git reset --soft 로
        # HEAD 만 옮겼더니, 작업 폴더에 있던 낡은 코드가 '내 변경' 으로
        # 둔갑해 같이 커밋됐다. 상태 커밋이 notify.py 를 옛 버전으로
        # 되돌려 버린 적이 있다(실측). 커밋 대상을 경로로 못 박는다.
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- state.json; then
            echo "변화 없음"
            exit 0
          fi
          git commit -q -o state.json -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"

          for try in 1 2 3; do
            if git push -q origin HEAD:master 2>/dev/null; then
              echo "저장 완료 (시도 $try)"
              exit 0
            fi
            echo "push 거부됨 ($try/3). 원격 기록과 합칩니다."
            git fetch -q origin master
            git show origin/master:state.json > /tmp/remote_state.json
            "$HOME/.venv-notice/bin/python" merge_state.py /tmp/remote_state.json state.json
            cp state.json /tmp/merged_state.json
            # 코드는 원격 것을 그대로 쓰고, 기록만 합친 것으로 얹는다.
            git checkout -q origin/master -- .
            git reset -q --hard origin/master
            cp /tmp/merged_state.json state.json
            if git diff --quiet -- state.json; then
              echo "합치고 보니 원격과 같습니다. 올릴 것이 없습니다."
              exit 0
            fi
            git commit -q -o state.json -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "세 번 시도했는데도 저장하지 못했습니다."
          exit 1

      - name: 실패했으면 빨간불로 남긴다
        if: steps.run.outcome == 'failure'
        run: |
          echo "감시 중 일부 실패. 위 '게시판 확인' 로그를 보세요."
          exit 1
