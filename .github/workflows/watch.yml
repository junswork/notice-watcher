name: 공지사항 감시

on:
  # 여기 적은 주기는 지켜지지 않는다. 5분으로 걸어도 실제 간격이 평균 87분,
  # 최악 260분이었다(실측). 정시 실행은 밖에서 깨우는 쪽이 맡는다 —
  # docs/정시실행.md 참고. 이 일정은 그쪽이 끊겼을 때를 위한 예비다.
  # 예비이므로 시간대를 잘게 나누지 않는다. 어차피 깃허브가 제 마음대로 돌린다.
  schedule:
    - cron: "*/15 * * * *"    # 새 글 (실제로는 두 시간쯤마다 돈다)
    - cron: "7 4,13 * * *"    # 수정까지. 13:07, 22:07 (KST) 예정
    #
    # 생존 신호는 여기 두지 않는다. 그 신호의 쓸모는 "안 오면 뭔가 멈춘
    # 것" 인데, 밖에서 깨우는 쪽이 죽었을 때 여기서 대신 보내 버리면
    # 바로 그 고장을 가려 버린다. 경보가 경보를 덮는 꼴이다.

  workflow_dispatch:
    inputs:
      mode:
        description: "new = 새 글만 / full = 수정까지"
        default: "new"
        type: choice
        options: [new, full]
      heartbeat:
        description: "살아 있다는 신호도 함께 보낼지"
        default: false
        type: boolean

permissions:
  contents: write           # state.json 을 되커밋하기 위해 필요하다

concurrency:
  group: notice-watch       # 앞 실행이 안 끝났으면 겹쳐 돌지 않는다
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 게시판 확인
        id: run
        continue-on-error: true       # 실패해도 아래 커밋 단계까지는 간다
        env:
          # 어느 일정이 깨웠는지로 확인 범위를 정한다. 손으로 돌릴 때는
          # 위 선택칸의 값을 쓰고, 아무것도 안 고르면 새 글만 본다.
          WATCH_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 4,13 * * *' && 'full' || 'new') }}
          HEARTBEAT: ${{ inputs.heartbeat && '1' || '' }}
          KAKAOWORK_USER_EMAIL: ${{ secrets.KAKAOWORK_USER_EMAIL }}
          # 게시판별 봇. boards.json 의 "bot" 이름과 반드시 같아야 한다.
          # 게시판을 추가하면 여기에도 한 줄 넣어야 한다 — 깃허브는 등록한
          # Secret 을 이름으로 나열해 줘야만 넘겨준다.
          KAKAOWORK_APP_KEY_NOTICE: ${{ secrets.KAKAOWORK_APP_KEY_NOTICE }}
          KAKAOWORK_APP_KEY_MATTERS: ${{ secrets.KAKAOWORK_APP_KEY_MATTERS }}
          KAKAOWORK_APP_KEY_HOUSING: ${{ secrets.KAKAOWORK_APP_KEY_HOUSING }}
          KAKAOWORK_APP_KEY_EPIC: ${{ secrets.KAKAOWORK_APP_KEY_EPIC }}
          # 에픽폴리오는 로그인이 필요하다. 통합 계정 아이디·비밀번호.
          EPIC_ID: ${{ secrets.EPIC_ID }}
          EPIC_PW: ${{ secrets.EPIC_PW }}
          # 위 봇이 아직 없는 게시판이 쓰는 공용 봇
          KAKAOWORK_APP_KEY: ${{ secrets.KAKAOWORK_APP_KEY }}
        run: python watch.py

      - name: 확인 결과 저장
        # 성공한 부분까지는 반드시 남긴다. 남기지 않으면 다음 실행이
        # 이미 알린 공지를 새 글로 착각해 같은 알림을 또 보낸다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "변화 없음" && exit 0
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: 실패했으면 빨간불로 남긴다
        if: steps.run.outcome == 'failure'
        run: |
          echo "감시 중 일부 실패. 위 '게시판 확인' 로그를 보세요."
          exit 1
